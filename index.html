<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata — what is buried in a BasePaint canvas</title>
    <meta
      name="description"
      content="Every BasePaint canvas is a stack of paintings, and only the top one has ever been visible. Strata replays the on-chain strokes and digs out the rest."
    />
    <!-- The shell's own tags, and the last resort. In the deployed site every
         route — the homepage included — is served through api/html.ts, which
         strips these and writes the title, description and card for the day or
         artist being asked for. They are what shows in the dev server, and what
         would show if that function ever failed to rewrite them. -->
    <!-- This file is also reachable on its own at /index.html, because that is
         where api/html.ts fetches its shell from and the route has to exist for
         it. Asked for directly it is a second copy of the homepage carrying no
         canonical link and a relative card URL, so it says not to keep it.
         api/html.ts strips this tag along with the rest — a real page gets the
         robots tag its own status decides, and there is a test for it. -->
    <meta name="robots" content="noindex" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strata" />
    <meta property="og:title" content="Strata — what is buried in a BasePaint canvas" />
    <meta
      property="og:description"
      content="Every BasePaint canvas is a stack of paintings, and only the top one has ever been visible. Strata replays the on-chain strokes and digs out the rest."
    />
    <meta property="og:image" content="/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/api/og" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
