<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strata — what is buried in a BasePaint canvas</title>
    <meta
      name="description"
      content="Every BasePaint canvas is a stack of paintings, and only the top one has ever been visible. Strata replays the on-chain strokes and digs out the rest."
    />
    <!-- The shell's own tags. Every other route is served through api/html.ts,
         which replaces the title and description with the day or artist being
         asked for; Vercel serves this file straight from the filesystem for "/",
         so the homepage unfurls from here. The card is today's canvas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Strata" />
    <meta property="og:title" content="Strata — what is buried in a BasePaint canvas" />
    <meta
      property="og:description"
      content="Every BasePaint canvas is a stack of paintings, and only the top one has ever been visible. Strata replays the on-chain strokes and digs out the rest."
    />
    <meta property="og:image" content="/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/api/og" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
